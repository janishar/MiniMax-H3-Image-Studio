[project]
name = "minimax-h3-image"
version = "0.1.0"
description = "MiniMax-H3-Image text-to-image and multi-image editing on Apple Silicon (int8 on MPS), with its PE prompt enhancer, and a helmstudio web studio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Janishar Ali", email = "janishar.ali@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "diffusers>=0.43.0",
    "helm-runtime-sdk>=1.0.0rc1,<2",
    "pillow>=12.3.0",
    "torch>=2.14.0,<2.15",  # torchvision 0.29 is built against 2.14
    "torchvision>=0.29.0",
    "transformers>=5.22.0",
]

[project.scripts]
minimax-h3-image = "minimax_h3_image:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
